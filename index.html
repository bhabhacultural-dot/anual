<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Janmashtami 2026 | Cultural Evening</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">

            <div class="eyebrow">
                School Cultural Programme
            </div>

            <h1>
                JANMASHTAMI 2026
            </h1>

            <p>
                Cultural Evening • Music Practice Player
            </p>

        </header>


        <!-- =================================================
             PLAYER
        ================================================== -->

        <section class="player-card">

            <!-- NOW PLAYING -->

            <div class="now-playing">

                <div class="now-label">
                    Now Playing
                </div>

                <div
                    class="song-title"
                    id="songTitle"
                >
                    Select a song
                </div>

                <div
                    class="song-number"
                    id="songNumber"
                >
                    -
                </div>

            </div>


            <!-- =================================================
                 PROGRESS
            ================================================== -->

            <div
                class="progress-wrapper"
                id="progressWrapper"
            >

                <div
                    class="progress-track"
                    id="progressTrack"
                >

                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>

                    <div
                        class="progress-thumb"
                        id="progressThumb"
                    ></div>

                </div>

                <div class="time-row">

                    <span id="currentTime">
                        0:00
                    </span>

                    <span id="duration">
                        0:00
                    </span>

                </div>

            </div>




<!-- =================================================
     AUDIO LEVEL METER
================================================== -->

<div class="audio-meter">

    <div class="meter-header">
        <span class="meter-title">Audio Level</span>
        <span
            class="clipping-indicator"
            id="clippingIndicator"
        >
            CLIPPING
        </span>
    </div>

    <!-- LEFT CHANNEL -->

    <div class="meter-channel">

        <div class="meter-label">
            <span>L</span>
            <span
                class="meter-db"
                id="leftDb"
            >
                -60 dB
            </span>
        </div>

        <div class="meter-track">

            <div
                class="meter-level"
                id="leftLevel"
            ></div>

            <div
                class="meter-peak"
                id="leftPeak"
            ></div>

        </div>

    </div>


    <!-- RIGHT CHANNEL -->

    <div class="meter-channel">

        <div class="meter-label">
            <span>R</span>
            <span
                class="meter-db"
                id="rightDb"
            >
                -60 dB
            </span>
        </div>

        <div class="meter-track">

            <div
                class="meter-level"
                id="rightLevel"
            ></div>

            <div
                class="meter-peak"
                id="rightPeak"
            ></div>

        </div>

    </div>

    <div class="meter-scale">
        <span>-60</span>
        <span>-48</span>
        <span>-36</span>
        <span>-24</span>
        <span>-12</span>
        <span>0 dBFS</span>
    </div>

</div>

            <!-- =================================================
                 MAIN CONTROLS
            ================================================== -->

            <div class="controls">

                <!-- PREVIOUS -->

                <button
                    class="control"
                    id="previousBtn"
                    title="Previous song"
                    aria-label="Previous song"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                    >

                        <polygon
                            points="19 20 9 12 19 4 19 20"
                            fill="currentColor"
                            stroke="none"
                        />

                        <line
                            x1="5"
                            y1="5"
                            x2="5"
                            y2="19"
                        />

                    </svg>

                </button>


                <!-- BACK 10 -->

                <button
                    class="control"
                    id="backBtn"
                    title="10 seconds backward"
                    aria-label="10 seconds backward"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                    >

                        <path d="M9 14l-4-4 4-4"/>

                        <path d="M5 10h7a6 6 0 1 1-4.24 10.24"/>

                        <text
                            x="10"
                            y="14"
                            font-size="6"
                            fill="currentColor"
                            stroke="none"
                        >
                            10
                        </text>

                    </svg>

                </button>


                <!-- PLAY -->

                <button
                    class="control play"
                    id="playBtn"
                    title="Play"
                    aria-label="Play"
                >

                    <svg
                        class="icon"
                        id="playIcon"
                        viewBox="0 0 24 24"
                    >

                        <polygon
                            points="8,5 19,12 8,19"
                            fill="currentColor"
                            stroke="none"
                        />

                    </svg>

                </button>


                <!-- FORWARD 10 -->

                <button
                    class="control"
                    id="forwardBtn"
                    title="10 seconds forward"
                    aria-label="10 seconds forward"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                    >

                        <path d="M15 14l4-4-4-4"/>

                        <path d="M19 10h-7a6 6 0 1 0 4.24 10.24"/>

                        <text
                            x="8"
                            y="14"
                            font-size="6"
                            fill="currentColor"
                            stroke="none"
                        >
                            10
                        </text>

                    </svg>

                </button>


                <!-- NEXT -->

                <button
                    class="control"
                    id="nextBtn"
                    title="Next song"
                    aria-label="Next song"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                    >

                        <polygon
                            points="5 4 15 12 5 20 5 4"
                            fill="currentColor"
                            stroke="none"
                        />

                        <line
                            x1="19"
                            y1="5"
                            x2="19"
                            y2="19"
                        />

                    </svg>

                </button>

            </div>


            <!-- =================================================
                 SECONDARY CONTROLS
            ================================================== -->

            <div class="secondary">

                <!-- REPEAT -->

                <button
                    class="small-btn"
                    id="repeatBtn"
                    title="Repeat current song"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                    >

                        <polyline points="17 1 21 5 17 9"/>

                        <path
                            d="M3 11V9a4 4 0 0 1 4-4h14"
                        />

                        <polyline points="7 23 3 19 7 15"/>

                        <path
                            d="M21 13v2a4 4 0 0 1-4 4H3"
                        />

                    </svg>

                    <span>
                        Repeat
                    </span>

                </button>


                <!-- SHUFFLE -->

                <button
                    class="small-btn"
                    id="shuffleBtn"
                    title="Shuffle"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                    >

                        <polyline points="16 3 21 3 21 8"/>

                        <line
                            x1="4"
                            y1="20"
                            x2="21"
                            y2="3"
                        />

                        <polyline points="21 16 21 21 16 21"/>

                        <line
                            x1="15"
                            y1="15"
                            x2="21"
                            y2="21"
                        />

                        <line
                            x1="4"
                            y1="4"
                            x2="9"
                            y2="9"
                        />

                    </svg>

                    <span>
                        Shuffle
                    </span>

                </button>


                <!-- SPEED -->

                <select
                    class="speed"
                    id="speed"
                    title="Playback speed"
                >

                    <option value="0.5">
                        0.5x
                    </option>

                    <option value="0.75">
                        0.75x
                    </option>

                    <option
                        value="1"
                        selected
                    >
                        1x
                    </option>

                    <option value="1.25">
                        1.25x
                    </option>

                    <option value="1.5">
                        1.5x
                    </option>

                    <option value="2">
                        2x
                    </option>

                </select>


                <!-- VOLUME -->

                <div class="volume-wrapper">

                    <button
                        id="muteBtn"
                        class="icon-btn"
                        title="Mute"
                        aria-label="Mute"
                    >

                        <svg
                            class="icon"
                            id="volumeIcon"
                            viewBox="0 0 24 24"
                        >

                            <polygon
                                points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"
                                fill="currentColor"
                                stroke="none"
                            />

                            <path
                                d="M15 9a4 4 0 0 1 0 6"
                            />

                            <path
                                d="M18 6a8 8 0 0 1 0 12"
                            />

                        </svg>

                    </button>

                    <input
                        class="volume"
                        id="volume"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="1"
                        aria-label="Volume"
                    >

                </div>

            </div>

        </section>


        <!-- =================================================
             PLAYLIST
        ================================================== -->

        <section class="playlist-card">

            <div class="playlist-top">

                <div class="playlist-title">
                    Playlist
                </div>

                <div
                    class="song-count"
                    id="songCount"
                >
                    0 songs
                </div>

            </div>


            <!-- SEARCH -->

            <input
                type="text"
                class="search"
                id="search"
                placeholder="Search songs..."
                autocomplete="off"
            >


            <!-- SONG LIST -->

            <div
                class="playlist"
                id="playlist"
            ></div>

        </section>


        <!-- FOOTER -->

        <div class="footer">
            Janmashtami 2026 • Cultural Evening
        </div>

    </div>


    <!-- =================================================
         AUDIO
    ================================================== -->

    <audio id="audio"></audio>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script src="script.js"></script>

</body>

</html>
